<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>QVCラウンジメンバー登録</title>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #222222;
      --subtext: #666666;
      --border: #d9d9de;
      --primary: #0a7cff;
      --primary-hover: #006ae6;
      --error-bg: #fff2f2;
      --error-text: #c62828;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic UI",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 16px;
    }

    .title {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.4;
      font-weight: 700;
    }

    .description {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--subtext);
      white-space: pre-line;
    }

    .field {
      margin-bottom: 16px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .required {
      color: #d32f2f;
      margin-left: 4px;
    }

    .input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(10, 124, 255, 0.12);
    }

    .error {
      display: none;
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--error-bg);
      color: var(--error-text);
      font-size: 14px;
      line-height: 1.6;
    }

    .error.is-visible {
      display: block;
    }

    .actions {
      margin-top: 8px;
    }

    .button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .button:hover {
      background: var(--primary-hover);
    }

    .button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--subtext);
      text-align: center;
      min-height: 1.5em;
    }

    .note {
      margin-top: 12px;
      font-size: 12px;
      color: var(--subtext);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <p class="description">お客様のお名前をご入力ください。
入力後、送信ボタンを押すと登録情報が送信されます。</p>

      <div id="errorMessage" class="error" aria-live="polite"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label class="label" for="nameKanji">
            名前（漢字）<span class="required">必須</span>
          </label>
          <input
            id="nameKanji"
            name="nameKanji"
            class="input"
            type="text"
            placeholder="山田 太郎"
            autocomplete="name"
            maxlength="100"
          />
        </div>

        <div class="field">
          <label class="label" for="nameKana">
            名前（かな）<span class="required">必須</span>
          </label>
          <input
            id="nameKana"
            name="nameKana"
            class="input"
            type="text"
            placeholder="やまだ たろう"
            autocomplete="off"
            maxlength="100"
          />
        </div>

        <div class="actions">
          <button id="submitButton" class="button" type="submit">送信</button>
        </div>
      </form>

      <div id="statusText" class="status" aria-live="polite"></div>

    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const LIFF_ID = "2011874972-GK9Ab1jO";

      const form = document.getElementById("registerForm");
      const nameKanjiInput = document.getElementById("nameKanji");
      const nameKanaInput = document.getElementById("nameKana");
      const submitButton = document.getElementById("submitButton");
      const errorMessage = document.getElementById("errorMessage");
      const statusText = document.getElementById("statusText");

      const DEFAULT_SEND_ERROR_MESSAGE =
        "送信に失敗しました。通信状況を確認のうえ、もう一度お試しください。";

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("is-visible");
      }

      function clearError() {
        errorMessage.textContent = "";
        errorMessage.classList.remove("is-visible");
      }

      function setStatus(message) {
        statusText.textContent = message || "";
      }

      function setSubmitting(isSubmitting) {
        submitButton.disabled = isSubmitting;
        submitButton.textContent = isSubmitting ? "送信中..." : "送信";
      }

      function trimValue(value) {
        return (value || "").trim();
      }

      function validateInputs() {
        const nameKanji = trimValue(nameKanjiInput.value);
        const nameKana = trimValue(nameKanaInput.value);

        nameKanjiInput.value = nameKanji;
        nameKanaInput.value = nameKana;

        if (!nameKanji) {
          showError("名前（漢字）を入力してください。");
          nameKanjiInput.focus();
          return null;
        }

        if (!nameKana) {
          showError("名前（かな）を入力してください。");
          nameKanaInput.focus();
          return null;
        }

        return {
          nameKanji,
          nameKana
        };
      }

      function buildMessageText(nameKanji, nameKana, userId) {
        return [
          "【QVCラウンジ登録情報】",
          `名前（漢字）：${nameKanji}`,
          `名前（かな）：${nameKana}`,
          `LINE 識別id：${userId}`
        ].join("\n");
      }

      async function initializeLiff() {
        if (typeof liff === "undefined") {
          showError("LIFF SDK が読み込まれていません。");
          return false;
        }

        try {
          setStatus("初期化中...");
          await liff.init({ liffId: LIFF_ID });

          if (!liff.isInClient()) {
            showError("このページはLINEアプリ内から開いてください。");
            setStatus("");
            return false;
          }

          if (!liff.isLoggedIn()) {
            liff.login();
            return false;
          }

          clearError();
          setStatus("");
          return true;
        } catch (error) {
          console.error("LIFF initialization error:", error);
          showError("LIFFの初期化に失敗しました。時間をおいて再度お試しください。");
          setStatus("");
          return false;
        }
      }

      async function getUserId() {
        try {
          const profile = await liff.getProfile();

          if (!profile || !profile.userId) {
            throw new Error("userId を取得できませんでした。");
          }

          return profile.userId;
        } catch (error) {
          console.error("getProfile error:", error);
          throw new Error("LINE userId の取得に失敗しました。");
        }
      }

      async function sendRegistrationMessage(nameKanji, nameKana) {
        const userId = await getUserId();
        const text = buildMessageText(nameKanji, nameKana, userId);

        await liff.sendMessages([
          {
            type: "text",
            text: text
          }
        ]);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearError();

        const values = validateInputs();
        if (!values) {
          return;
        }

        const confirmed = window.confirm("入力内容を送信します。よろしいですか？");
        if (!confirmed) {
          return;
        }

        setSubmitting(true);
        setStatus("送信中...");

        try {
          await sendRegistrationMessage(values.nameKanji, values.nameKana);

          setStatus("送信が完了しました。");
          await liff.closeWindow();
        } catch (error) {
          console.error("sendMessages error:", error);
          showError(DEFAULT_SEND_ERROR_MESSAGE);
          setStatus("");
        } finally {
          setSubmitting(false);
        }
      });

      window.addEventListener("DOMContentLoaded", async () => {
        await initializeLiff();
      });
    })();
  </script>
</body>
</html>
